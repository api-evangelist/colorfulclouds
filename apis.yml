description: >-
  ColorfulClouds Tech (彩云科技, Beijing-based) operates the Caiyun Weather API (api.caiyunapp.com), a hyperlocal weather +
  air quality forecasting service with minute-level precipitation, hourly forecasts up to 360 hours, daily forecasts up
  to 15 days, real-time AQI/pollutant readings, severe-weather alerts, and a precipitation map raster. The v2.6 platform
  powers consumer apps (Amap, Sina Weather) and enterprise weather integrations across China and globally, billed via
  tiered token plans on the Open Platform.
